name: 💡 Предложить идею
description: Новая функция или улучшение
labels: ["idea"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Что хотелось бы?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Зачем это нужно?
      description: Какую задачу решит
  - type: input
    id: version
    attributes:
      label: Версия Anixart PC
  - type: input
    id: os
    attributes:
      label: Система
